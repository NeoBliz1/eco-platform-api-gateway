name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./api/... ./pkg/... .

      # test/e2e needs the full platform running, so CI runs unit tests only
      - name: Unit tests
        run: go test -race ./pkg/...
